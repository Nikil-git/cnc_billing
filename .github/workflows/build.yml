name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller reportlab

      - name: Build EXE
        run: |
          pyinstaller --noconsole --onefile --name "CNC_Billing" --add-data "logo.png;." cnc_billing.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CNC_Billing-windows
          path: dist/CNC_Billing.exe
